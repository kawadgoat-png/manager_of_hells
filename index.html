<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>VERITY</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}


body{

height:100vh;
overflow:hidden;

background:
radial-gradient(circle at center,
#250000,
#080000 50%,
#000 90%);

display:flex;
justify-content:center;
align-items:center;

font-family:"Courier New",monospace;

}



/* brouillard */

body:before{

content:"";

position:absolute;

inset:-50%;

background:
radial-gradient(circle,
rgba(255,0,0,.08),
transparent 45%);

animation:fog 15s linear infinite;

}


@keyframes fog{

to{
transform:rotate(360deg);
}

}





/* particules */

.particle{

position:absolute;

width:3px;
height:3px;

background:#660000;

border-radius:50%;

animation:fall linear infinite;

}


@keyframes fall{

from{
transform:translateY(-100vh);
}

to{
transform:translateY(100vh);
}

}





/* vortex */

.vortex{

position:absolute;

width:450px;
height:450px;

border-radius:50%;

background:
conic-gradient(
transparent,
#550000,
transparent,
#110000
);

filter:blur(35px);

animation:spin 10s linear infinite;

}



@keyframes spin{

to{
transform:rotate(360deg);
}

}





/* oeil */

.eye{

width:240px;
height:240px;

border-radius:50%;

position:relative;

background:

radial-gradient(circle,

#000 0%,
#000 18%,
#1b0000 35%,
#7a0000 55%,
#220000 75%,
#000 100%);


box-shadow:

0 0 40px red,
0 0 120px #550000,
0 0 200px black;


transition:.5s;

animation:pulse 4s infinite;

}



@keyframes pulse{

50%{
transform:scale(1.05);
}

}





/* pupille */

.pupil{

position:absolute;

width:70px;
height:70px;

background:#000;

border-radius:50%;


left:50%;
top:50%;


transform:translate(-50%,-50%);

box-shadow:
0 0 35px black;


}


.pupil:after{

content:"";

position:absolute;

width:15px;
height:15px;

background:white;

border-radius:50%;

top:15px;
left:18px;

}




/* textes verity */


.verity{

position:absolute;

color:#888;

font-size:24px;

letter-spacing:6px;

transition:.4s;

cursor:pointer;

text-shadow:
0 0 15px black;


}



.verity:hover{

color:red;

text-shadow:

0 0 20px red,
0 0 50px red;

}




.v1{

left:15%;

top:50%;

transform:translateY(-50%);

}



.v2{

right:15%;

top:50%;

transform:translateY(-50%);

}



.v3{

top:20%;

left:50%;

transform:translateX(-50%);

}



.v4{

bottom:20%;

left:50%;

transform:translateX(-50%);

}





/* réaction */


.redEye{

transform:scale(.7);

background:

radial-gradient(circle,

black,
red,
#ff0000,
black)!important;


box-shadow:

0 0 100px red,
0 0 200px red!important;

}





/* écran final */


#screen{

position:absolute;

inset:0;

background:

linear-gradient(
white,
#ddd
);

opacity:0;

display:flex;

align-items:center;
justify-content:center;

transition:5s;

pointer-events:none;

}


#code{

font-size:25px;

letter-spacing:8px;

opacity:0;

color:black;

transition:3s;

}




.show{

opacity:1!important;

}


</style>

</head>



<body>



<div class="vortex"></div>



<div class="verity v1"
onmouseenter="danger(true)"
onmouseleave="danger(false)">
VERITY
</div>


<div class="verity v2"
onmouseenter="danger(true)"
onmouseleave="danger(false)">
VERITY
</div>


<div class="verity v3"
onmouseenter="danger(true)"
onmouseleave="danger(false)">
VERITY
</div>


<div class="verity v4"
onmouseenter="danger(true)"
onmouseleave="danger(false)">
VERITY
</div>




<div class="eye" onclick="openEye()">

<div class="pupil"></div>

</div>



<div id="screen">

<div id="code">

F2dYwGvJ8y6pN7mXQ3tK9vL4sA8rP6zE5cW1hB9uD7oV3

</div>

</div>




<script>


// particules

for(let i=0;i<120;i++){

let p=document.createElement("div");

p.className="particle";

p.style.left=Math.random()*100+"%";

p.style.animationDuration=
(3+Math.random()*8)+"s";

document.body.appendChild(p);

}





// oeil suit souris

document.addEventListener("mousemove",e=>{


let pupil=document.querySelector(".pupil");


let x=(e.clientX/window.innerWidth-.5)*40;

let y=(e.clientY/window.innerHeight-.5)*40;


pupil.style.marginLeft=x+"px";

pupil.style.marginTop=y+"px";


});





function danger(x){

let eye=document.querySelector(".eye");

if(x){

eye.classList.add("redEye");

}else{

eye.classList.remove("redEye");

}

}





function openEye(){

document.getElementById("screen")
.classList.add("show");


setTimeout(()=>{

document.getElementById("code")
.classList.add("show");

},5000);


}



</script>


</body>
</html>
