<!DOCTYPE html>
<html lang="fr">
<head>

<meta charset="UTF-8">
<title>VERITY</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}


body{

height:100vh;
overflow:hidden;

background:
radial-gradient(circle at center,
#180000,
#050000 55%,
#000 100%);

display:flex;
align-items:center;
justify-content:center;

font-family:"Times New Roman",serif;

}



/* brume */

body:before{

content:"";

position:absolute;

inset:-100px;

background:

radial-gradient(
circle,
rgba(255,0,0,.06),
transparent 60%
);

filter:blur(50px);

animation:fog 20s infinite linear;

}



@keyframes fog{

from{
transform:rotate(0deg);
}

to{
transform:rotate(360deg);
}

}




/* ombres mouvantes */


.shadow{

position:absolute;

width:600px;
height:600px;

border-radius:50%;

background:#000;

opacity:.25;

filter:blur(80px);

animation:move 10s infinite alternate;

}


@keyframes move{

from{
transform:translate(-100px);
}

to{
transform:translate(100px);
}

}




/* cercle derrière */


.vortex{

position:absolute;

width:500px;
height:500px;

border-radius:50%;


background:

radial-gradient(
circle,
transparent 40%,
#240000,
transparent 70%
);


filter:blur(30px);

animation:rotate 12s linear infinite;

}


@keyframes rotate{

to{
transform:rotate(360deg);
}

}





/* OEIL REALISTE */


.eye{


width:260px;
height:260px;


border-radius:50%;


position:relative;


background:


radial-gradient(circle at 35% 30%,

rgba(255,255,255,.8) 0%,

transparent 8%),


radial-gradient(circle,

#000 0%,

#050505 18%,

#2b0000 30%,

#850000 45%,

#3a0000 65%,

#050000 100%);



box-shadow:


inset 0 0 40px black,

0 0 60px #500000,

0 0 150px black;



transition:.6s;


animation:breath 5s infinite;

overflow:hidden;

}




@keyframes breath{

50%{

transform:scale(1.04);

}

}




/* reflet oeil */


.eye:before{


content:"";


position:absolute;

width:80px;
height:80px;


background:

radial-gradient(circle,
white,
transparent);


opacity:.25;


top:35px;
left:45px;


border-radius:50%;

}





/* iris */


.eye:after{


content:"";


position:absolute;


inset:25px;


border-radius:50%;


background:

repeating-conic-gradient(

#ff3300 0deg,

#300000 10deg,

#ff0000 20deg

);



opacity:.25;


}




/* pupille */


.pupil{


position:absolute;


z-index:5;


width:75px;

height:75px;


background:#000;


border-radius:50%;


left:50%;

top:50%;


transform:translate(-50%,-50%);


box-shadow:

0 0 50px black;



}




.pupil:after{


content:"";


position:absolute;


width:18px;

height:18px;


background:white;


border-radius:50%;


top:15px;

left:18px;


}





/* VERITY */


.verity{


position:absolute;


color:#999;


font-size:30px;


letter-spacing:12px;


cursor:pointer;


font-weight:bold;


opacity:.7;


transition:.5s;


text-shadow:


0 0 5px #000,

0 0 20px #550000;



animation:flicker 4s infinite;



}



@keyframes flicker{


0%,100%{

opacity:.7;

}


50%{

opacity:1;

}


}





.verity:hover{


color:#ff0000;


opacity:1;


text-shadow:


0 0 10px red,

0 0 40px red,

0 0 80px red;


}




.left{

left:12%;

}


.right{

right:12%;

}


.top{

top:25%;

}


.bottom{

bottom:25%;

}



.center{

top:50%;

transform:translateY(-50%);

}




/* peur */


.scared{


transform:scale(.75);


filter:

brightness(1.8)

contrast(1.5);


box-shadow:


0 0 120px red,

0 0 250px red!important;


}




/* final */


#screen{


position:absolute;

inset:0;


background:

linear-gradient(

white,

#ddd

);


opacity:0;


display:flex;

align-items:center;

justify-content:center;


transition:5s;


}




#code{


font-family:monospace;


font-size:24px;


letter-spacing:10px;


color:#000;


opacity:0;


transition:3s;


}



.show{

opacity:1!important;

}



</style>

</head>



<body>


<div class="shadow"></div>

<div class="vortex"></div>



<div class="verity left center"
onmouseenter="fear(1)"
onmouseleave="fear(0)">
VERITY
</div>


<div class="verity right center"
onmouseenter="fear(1)"
onmouseleave="fear(0)">
VERITY
</div>


<div class="verity top"
onmouseenter="fear(1)"
onmouseleave="fear(0)">
VERITY
</div>


<div class="verity bottom"
onmouseenter="fear(1)"
onmouseleave="fear(0)">
VERITY
</div>





<div class="eye" onclick="openEye()">

<div class="pupil"></div>

</div>




<div id="screen">

<div id="code">

F2dYwGvJ8y6pN7mXQ3tK9vL4sA8rP6zE5cW1hB9uD7oV3

</div>

</div>



<script>


for(let i=0;i<80;i++){

let p=document.createElement("div");

p.style.position="absolute";

p.style.width="2px";

p.style.height="2px";

p.style.background="#550000";

p.style.left=Math.random()*100+"%";

p.style.top=Math.random()*100+"%";

p.style.opacity=Math.random();

document.body.appendChild(p);

}




document.addEventListener("mousemove",e=>{


let p=document.querySelector(".pupil");


let x=(e.clientX/window.innerWidth-.5)*45;

let y=(e.clientY/window.innerHeight-.5)*45;


p.style.marginLeft=x+"px";

p.style.marginTop=y+"px";


});





function fear(x){

let eye=document.querySelector(".eye");


if(x){

eye.classList.add("scared");

}

else{

eye.classList.remove("scared");

}

}




function openEye(){


document.getElementById("screen")
.classList.add("show");


setTimeout(()=>{

document.getElementById("code")
.classList.add("show");

},5000);


}



</script>


</body>
</html>
