<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<title>VERITY</title>


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}


body{

height:100vh;
overflow:hidden;

background:

radial-gradient(
circle at center,
#250000,
#080000 50%,
#000 100%
);


display:flex;
align-items:center;
justify-content:center;


font-family:"Courier New",monospace;


}



/* =========================
   BRUME
========================= */


body:before{


content:"";

position:absolute;

inset:-200px;


background:

radial-gradient(
circle,
rgba(255,0,0,.08),
transparent 60%
);



filter:blur(60px);


animation:fog 25s linear infinite;


}



@keyframes fog{


from{

transform:rotate(0deg);

}


to{

transform:rotate(360deg);

}


}




/* =========================
   PARTICULES
========================= */


.particle{


position:absolute;


width:3px;

height:3px;


background:#660000;


border-radius:50%;


opacity:.5;


animation:fall linear infinite;


}



@keyframes fall{


from{

transform:translateY(-100vh);

}


to{

transform:translateY(100vh);

}


}





/* =========================
   OMBRE
========================= */


.shadow{


position:absolute;


width:700px;

height:700px;


background:black;


opacity:.3;


border-radius:50%;


filter:blur(100px);


}





/* =========================
   VORTEX
========================= */


.vortex{


position:absolute;


width:520px;

height:520px;


border-radius:50%;



background:


conic-gradient(

transparent,

#550000,

transparent,

#150000

);



filter:blur(40px);



animation:spin 15s linear infinite;



}



@keyframes spin{


to{

transform:rotate(360deg);

}


}





/* =========================
   OEIL
========================= */


.eye{


width:260px;

height:260px;


border-radius:50%;


position:relative;


background:



radial-gradient(circle at 35% 30%,

rgba(255,255,255,.7),

transparent 8%),


radial-gradient(circle,

#000,

#100000 25%,

#650000 50%,

#220000 75%,

#000);



box-shadow:


inset 0 0 50px black,

0 0 80px #700000,

0 0 200px black;



transition:.5s;



animation:breath 5s infinite;



overflow:hidden;


}



@keyframes breath{


50%{

transform:scale(1.04);

}


}





/* iris */

.eye:after{


content:"";


position:absolute;


inset:30px;


border-radius:50%;


background:


repeating-conic-gradient(

#ff2200 0deg,

#300000 12deg,

#900000 20deg

);



opacity:.25;


}



/* reflet */

.eye:before{


content:"";


position:absolute;


width:70px;

height:70px;


background:white;


opacity:.15;


border-radius:50%;


top:35px;

left:45px;


z-index:2;


}





/* pupille */


.pupil{


position:absolute;


z-index:5;


width:75px;

height:75px;


background:#000;


border-radius:50%;


left:50%;

top:50%;


transform:translate(-50%,-50%);


box-shadow:0 0 50px black;


}



.pupil:after{


content:"";


position:absolute;


width:18px;

height:18px;


background:white;


border-radius:50%;


top:15px;

left:18px;


}



/* =========================
   VERITY
========================= */


.verity{


position:absolute;


color:#aaa;


font-size:32px;


font-weight:bold;


letter-spacing:10px;


cursor:pointer;


opacity:.75;


transition:.5s;



text-shadow:


0 0 5px black,

0 0 20px #550000;



animation:flicker 4s infinite;



user-select:none;


}




@keyframes flicker{


0%,100%{

opacity:.7;

}


50%{

opacity:1;

}


}





.verity:hover{


color:red;


opacity:1;


text-shadow:


0 0 15px red,

0 0 50px red;


}





/* positions */


.left{


left:12%;


}



.right{


right:12%;


}



.center{


top:50%;


transform:translateY(-50%);


}



.top{


top:18%;


left:50%;


transform:translateX(-50%);


}



.bottom{


bottom:18%;


left:50%;


transform:translateX(-50%);


}





/* =========================
   VERITY DETRUIT
========================= */


.broken{


animation:breakWord .8s forwards;


pointer-events:none;


}



@keyframes breakWord{


0%{

transform:scale(1);

opacity:1;

}



25%{


transform:

translateX(15px)

rotate(5deg);


color:red;


}



50%{


transform:

translateX(-20px)

rotate(-10deg)

scale(1.3);


}



100%{


opacity:0;


filter:blur(20px);


transform:

scale(2)

translateY(-50px);


}


}





/* morceaux qui explosent */


.shard{


position:absolute;


color:red;


font-size:22px;


font-weight:bold;


pointer-events:none;


z-index:20;


animation:explode .9s forwards;


}



@keyframes explode{


from{


opacity:1;


transform:

translate(0,0)

rotate(0deg);


}



to{


opacity:0;


transform:


translate(

calc(-150px + 300px * var(--x)),

calc(-150px + 300px * var(--y))

)

rotate(360deg);



}


}





/* =========================
   OEIL REACTION
========================= */


.scared{


transform:scale(.75);


filter:

brightness(1.8)

contrast(1.5);



box-shadow:


0 0 100px red,

0 0 250px red;



}





/* =========================
   ECRAN FINAL
========================= */


#screen{


position:absolute;


inset:0;


background:


linear-gradient(

white,

#ddd

);



opacity:0;


pointer-events:none;


display:flex;


justify-content:center;


align-items:center;


transition:5s;


z-index:50;


}




#code{


font-family:monospace;


font-size:25px;


letter-spacing:8px;


color:black;


opacity:0;


transition:3s;


text-align:center;


}





.show{


opacity:1!important;


}





</style>


</head>



<body>



<div class="shadow"></div>


<div class="vortex"></div>



<!-- LES 4 VERITY -->


<div class="verity left center"
onclick="activateVerity(this)">
VERITY
</div>



<div class="verity right center"
onclick="activateVerity(this)">
VERITY
</div>



<div class="verity top"
onclick="activateVerity(this)">
VERITY
</div>



<div class="verity bottom"
onclick="activateVerity(this)">
VERITY
</div>





<div class="eye">


<div class="pupil"></div>


</div>




<div id="screen">


<div id="code">

F2dYwGvJ8y6pN7mXQ3tK9vL4sA8rP6zE5cW1hB9uD7oV3

</div>


</div>
<script>


/* =========================
   PARTICULES
========================= */


for(let i = 0; i < 120; i++){


let p = document.createElement("div");


p.className="particle";


p.style.left=Math.random()*100+"%";


p.style.top=Math.random()*100+"%";


p.style.animationDuration=
(4 + Math.random()*10)+"s";


p.style.opacity=Math.random();


document.body.appendChild(p);


}





/* =========================
   OEIL SUIT LE CURSEUR
========================= */


document.addEventListener("mousemove", e=>{


let pupil=document.querySelector(".pupil");


let eye=document.querySelector(".eye");


let rect=eye.getBoundingClientRect();



let centerX=
rect.left + rect.width/2;


let centerY=
rect.top + rect.height/2;



let mouseX=e.clientX-centerX;

let mouseY=e.clientY-centerY;



let distance=Math.sqrt(
mouseX*mouseX +
mouseY*mouseY
);



let max=45;



let moveX=
(mouseX/distance)*max;



let moveY=
(mouseY/distance)*max;



if(distance < max){

moveX=mouseX;

moveY=mouseY;

}



pupil.style.transform=
`
translate(
calc(-50% + ${moveX}px),
calc(-50% + ${moveY}px)
)
`;



});







/* =========================
   SYSTEM DES 4 VERITY
========================= */


let destroyed=0;



function activateVerity(element){



// empêcher double clic

if(element.classList.contains("broken")){

return;

}



element.classList.add("broken");



destroyed++;





/* explosion des morceaux */


for(let i=0;i<12;i++){



let shard=document.createElement("div");


shard.className="shard";


shard.innerHTML="VERITY";



let rect=
element.getBoundingClientRect();



shard.style.left=
(rect.left + rect.width/2)+"px";


shard.style.top=
(rect.top + rect.height/2)+"px";



shard.style.setProperty(
"--x",
Math.random()
);



shard.style.setProperty(
"--y",
Math.random()
);



document.body.appendChild(shard);



setTimeout(()=>{

shard.remove();

},1000);



}





/* réaction oeil */


let eye=document.querySelector(".eye");


eye.classList.add("scared");



setTimeout(()=>{


eye.classList.remove("scared");


},700);







/* les 4 trouvés */


if(destroyed===4){



setTimeout(()=>{


unlock();



},1500);



}




}







/* =========================
   FIN ARG
========================= */


function unlock(){



let screen=
document.getElementById("screen");



screen.classList.add("show");




setTimeout(()=>{


document.getElementById("code")
.classList.add("show");



},5000);



}




</script>


</body>

</html>
