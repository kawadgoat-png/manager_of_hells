<!DOCTYPE html>
<html lang="fr">
<head>

<meta charset="UTF-8">
<title>Hell's Floor</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

height:100vh;
overflow:hidden;

background:
radial-gradient(circle at center,
#300000 0%,
#0b0000 40%,
#000 80%);

display:flex;
justify-content:center;
align-items:center;

font-family:"Courier New",monospace;

}



/* BRUME */

body:before{

content:"";

position:absolute;

width:200%;
height:200%;

background:
radial-gradient(circle,
rgba(255,0,0,.08),
transparent 50%);

animation:fog 20s linear infinite;

}



@keyframes fog{

from{
transform:rotate(0deg);
}

to{
transform:rotate(360deg);
}

}



/* PARTICULES */

.particle{

position:absolute;

width:3px;
height:3px;

background:#8b0000;

border-radius:50%;

opacity:.5;

animation:fall linear infinite;

}


@keyframes fall{

from{
transform:translateY(-100vh);
}

to{
transform:translateY(100vh);
}

}




/* CERCLE DERRIERE */

.vortex{

position:absolute;

width:500px;
height:500px;

border-radius:50%;


background:
conic-gradient(
transparent,
#330000,
transparent,
#900000,
transparent
);


filter:blur(35px);

animation:rotate 12s linear infinite;

}


@keyframes rotate{

from{
transform:rotate(0);
}

to{
transform:rotate(360deg);
}

}




/* OEIL */


.eye{

width:230px;
height:230px;

border-radius:50%;

background:

radial-gradient(circle,

#000 0%,
#050505 20%,
#550000 45%,
#ff4b00 70%,
#100000 100%);


box-shadow:

0 0 40px #ff0000,
0 0 100px #700000,
0 0 180px black;


position:relative;

cursor:pointer;

transition:.5s;


animation:pulse 4s infinite;

}



@keyframes pulse{

50%{

transform:scale(1.05);

}

}




/* PUPILLE */


.pupil{

position:absolute;

width:65px;
height:65px;


background:#000;

border-radius:50%;


top:50%;
left:50%;


transform:translate(-50%,-50%);


box-shadow:0 0 30px black;


transition:.2s;

}



.pupil:after{

content:"";

position:absolute;

width:18px;
height:18px;

background:white;

border-radius:50%;

top:12px;
left:15px;

}





/* VERITY */

.word{

position:absolute;

color:#777;

font-size:22px;

letter-spacing:8px;

cursor:pointer;

transition:.4s;

text-shadow:
0 0 10px black;


}


.word:hover{

color:red;

text-shadow:

0 0 15px red,
0 0 40px red;


}



.left{

right:calc(50% + 180px);

}


.right{

left:calc(50% + 180px);

}



.top{

top:25%;

}



.bottom{

bottom:25%;

}





/* MODE DANGER */


.danger{

background:

radial-gradient(circle,

#ff0000,
#550000,
#000)!important;


transform:scale(.75)!important;


box-shadow:

0 0 100px red,
0 0 200px red!important;


}





/* TEXTE FINAL */


#screen{

position:absolute;

inset:0;


background:

linear-gradient(
white,
#ddd
);


opacity:0;

pointer-events:none;

display:flex;

justify-content:center;

align-items:center;

transition:5s;


}



#message{

color:black;

font-size:25px;

letter-spacing:10px;

opacity:0;


}




.show{

opacity:1!important;

}




.glitch{

position:absolute;

color:red;

animation:glitch .5s infinite;

font-size:12px;

}



@keyframes glitch{

50%{

transform:translateX(5px);

}

}



</style>

</head>


<body>



<div class="vortex"></div>



<div class="word left top"
onmouseenter="fear(true)"
onmouseleave="fear(false)">
verity
</div>


<div class="word right top"
onmouseenter="fear(true)"
onmouseleave="fear(false)">
verity
</div>



<div class="word left bottom"
onmouseenter="fear(true)"
onmouseleave="fear(false)">
verity
</div>



<div class="word right bottom"
onmouseenter="fear(true)"
onmouseleave="fear(false)">
verity
</div>





<div class="eye" onclick="openEye()">



<div class="pupil"></div>



</div>




<div id="screen">

<div id="message">

F2dYwGvJ8y6pN7mXQ3tK9vL4sA8rP6zE5cW1hB9uD7oV3

</div>

</div>





<script>


// particules

for(let i=0;i<100;i++){


let p=document.createElement("div");

p.className="particle";


p.style.left=Math.random()*100+"%";


p.style.animationDuration=
(4+Math.random()*10)+"s";


document.body.appendChild(p);


}





// oeil suit souris


document.addEventListener("mousemove",e=>{


let pupil=document.querySelector(".pupil");


let x=(e.clientX/window.innerWidth-.5)*35;

let y=(e.clientY/window.innerHeight-.5)*35;


pupil.style.left=
"calc(50% + "+x+"px)";


pupil.style.top=
"calc(50% + "+y+"px)";


});






// verity reaction


function fear(state){


let eye=document.querySelector(".eye");


if(state){

eye.classList.add("danger");

}

else{

eye.classList.remove("danger");

}


}





// ouverture


function openEye(){


document.getElementById("screen")
.classList.add("show");


setTimeout(()=>{

document.getElementById("message")
.classList.add("show");

},5000);


}



</script>


</body>
</html>
