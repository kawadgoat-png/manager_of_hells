<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<title>VERITY</title>


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}


body{

height:100vh;
overflow:hidden;

background:

radial-gradient(
circle at center,
#300000,
#090000 45%,
#000 100%
);


display:flex;

justify-content:center;

align-items:center;


font-family:"Courier New",monospace;


}



/* =========================
   BROUILLARD
========================= */


body:before{


content:"";


position:absolute;


inset:-300px;


background:


radial-gradient(
circle,
rgba(255,0,0,.12),
transparent 55%
);



filter:blur(90px);



animation:fog 30s linear infinite;


}



@keyframes fog{


from{

transform:rotate(0deg) scale(1);

}


to{

transform:rotate(360deg) scale(1.2);

}


}





/* =========================
   PARTICULES GENERALES
========================= */


.particle{


position:absolute;


border-radius:50%;


pointer-events:none;


animation:floatParticle linear infinite;


}



@keyframes floatParticle{


0%{

transform:
translateY(-100vh)
translateX(0)
rotate(0deg);

opacity:0;

}



20%{

opacity:1;

}



100%{


transform:

translateY(100vh)

translateX(100px)

rotate(360deg);


opacity:0;


}


}






/* =========================
   CENDRES NOIRES
========================= */


.ash{


background:#000;


width:4px;

height:4px;


}





/* =========================
   SANG / ETINCELLES
========================= */


.blood{


background:#ff0000;


box-shadow:

0 0 10px red,

0 0 20px red;


}





/* =========================
   PARTICULES LUMIERE
========================= */


.spark{


background:#ff6600;


box-shadow:

0 0 15px orange;


}




/* =========================
   VORTEX
========================= */


.vortex{


position:absolute;


width:550px;


height:550px;


border-radius:50%;



background:


conic-gradient(

transparent,

#550000,

transparent,

#180000,

transparent

);



filter:blur(45px);



animation:spin 12s linear infinite;


}




@keyframes spin{


to{

transform:rotate(360deg);

}


}

/* =========================
   OMBRE PROFONDE
========================= */


.shadow{


position:absolute;


width:800px;


height:800px;


border-radius:50%;


background:black;


opacity:.45;


filter:blur(120px);



animation:shadowMove 12s infinite alternate;


}



@keyframes shadowMove{


from{

transform:translateX(-80px);

}


to{

transform:translateX(80px);

}


}





/* =========================
   OEIL DEMONIAQUE
========================= */


.eye{


width:260px;


height:260px;



border-radius:50%;


position:relative;



overflow:hidden;



background:



radial-gradient(circle at 35% 25%,

rgba(255,255,255,.8),

transparent 8%),



radial-gradient(circle,

#000 0%,

#070000 18%,

#220000 35%,

#900000 55%,

#260000 75%,

#000 100%);



box-shadow:



inset 0 0 60px black,


0 0 80px #700000,


0 0 200px black;



transition:.6s;


animation:breath 5s infinite;


}




@keyframes breath{


50%{


transform:scale(1.06);


}


}





/* iris profond */


.eye:after{


content:"";


position:absolute;


inset:25px;


border-radius:50%;



background:



repeating-conic-gradient(

from 0deg,

#ff3300 0deg,

#420000 8deg,

#b00000 15deg,

#150000 25deg

);



opacity:.35;


animation:irisSpin 20s linear infinite;



}



@keyframes irisSpin{


to{

transform:rotate(360deg);

}


}






/* reflet de lumière */


.eye:before{


content:"";


position:absolute;



width:80px;


height:80px;



border-radius:50%;



background:white;



opacity:.18;



top:35px;


left:45px;



z-index:4;


filter:blur(5px);


}






/* pupille */


.pupil{


position:absolute;


z-index:6;



width:75px;


height:75px;



border-radius:50%;



background:#000;



left:50%;


top:50%;



transform:translate(-50%,-50%);



box-shadow:



0 0 40px black,

0 0 80px #000;



transition:.15s;


}





.pupil:after{


content:"";


position:absolute;



width:18px;


height:18px;



background:white;



border-radius:50%;



top:15px;


left:18px;



opacity:.8;


}





/* =========================
   VERITY
========================= */


.verity{


position:absolute;



color:#aaa;



font-size:32px;



font-weight:bold;



letter-spacing:12px;



cursor:pointer;



opacity:.8;



user-select:none;



transition:.5s;



text-shadow:



0 0 10px black,

0 0 25px #550000;



animation:flicker 5s infinite;



}





@keyframes flicker{


0%,100%{

opacity:.7;

}


50%{

opacity:1;

}



}




.verity:hover{


color:red;



text-shadow:



0 0 20px red,

0 0 60px red;


}





/* positions */


.left{


left:12%;


}



.right{


right:12%;


}



.center{


top:50%;


transform:translateY(-50%);


}



.top{


top:18%;


left:50%;


transform:translateX(-50%);


}



.bottom{


bottom:18%;


left:50%;


transform:translateX(-50%);


}

/* =========================
   VERITY DETRUIT
========================= */


.broken{


animation:breakWord .9s forwards;


pointer-events:none;


}



@keyframes breakWord{


0%{


transform:scale(1);


opacity:1;


}



25%{


transform:


translateX(15px)

rotate(8deg);


color:red;


}



50%{


transform:


translateX(-25px)

rotate(-12deg)

scale(1.4);


}



100%{


opacity:0;


filter:blur(25px);



transform:


scale(2)

translateY(-80px);



}


}





/* morceaux du mot */


.shard{


position:absolute;



z-index:20;



font-size:22px;



font-weight:bold;



color:red;



pointer-events:none;



animation:explode .9s forwards;



text-shadow:


0 0 20px red;


}



@keyframes explode{


from{


opacity:1;


transform:


translate(0,0)

rotate(0deg);


}



to{


opacity:0;


transform:


translate(

calc(-200px + 400px * var(--x)),

calc(-200px + 400px * var(--y))

)

rotate(500deg);


}



}





/* =========================
   REACTION OEIL
========================= */


.scared{


transform:scale(.75);



filter:

brightness(2)

contrast(1.5);



background:


radial-gradient(circle,

#000,

#ff0000,

#700000,

black)!important;



box-shadow:



0 0 120px red,

0 0 300px red!important;



}





/* =========================
   ECRAN FINAL
========================= */


#screen{


position:absolute;


inset:0;



background:


linear-gradient(

white,

#e5e5e5

);



opacity:0;



pointer-events:none;



display:flex;



justify-content:center;



align-items:center;



transition:5s;



z-index:100;



}





#code{


font-family:monospace;



font-size:26px;



letter-spacing:10px;



color:black;



opacity:0;



transition:4s;



text-align:center;



}





.show{


opacity:1!important;


}






</style>


</head>



<body>



<div class="shadow"></div>



<div class="vortex"></div>




<!-- LES 4 VERITY -->


<div class="verity left center"
onclick="activateVerity(this)">
VERITY
</div>



<div class="verity right center"
onclick="activateVerity(this)">
VERITY
</div>



<div class="verity top"
onclick="activateVerity(this)">
VERITY
</div>



<div class="verity bottom"
onclick="activateVerity(this)">
VERITY
</div>




<div class="eye">


<div class="pupil"></div>


</div>




<div id="screen">


<div id="code">


F2dYwGvJ8y6pN7mXQ3tK9vL4sA8rP6zE5cW1hB9uD7oV3


</div>


</div>
<script>


/* =========================
   GENERATION DES PARTICULES
========================= */


function createParticles(type, amount){


for(let i=0;i<amount;i++){


let p=document.createElement("div");


p.className="particle "+type;



let size =
Math.random()*6+2;


p.style.width=size+"px";

p.style.height=size+"px";



p.style.left=
Math.random()*100+"%";



p.style.top=
Math.random()*100+"%";



p.style.animationDuration=
(3+Math.random()*12)+"s";



p.style.animationDelay=
Math.random()*8+"s";



p.style.opacity=
Math.random();



document.body.appendChild(p);



}


}



// énormément de particules

createParticles("ash",180);

createParticles("blood",70);

createParticles("spark",40);








/* =========================
   OEIL SUIT LE CURSEUR
========================= */


document.addEventListener("mousemove",e=>{


let pupil=document.querySelector(".pupil");

let eye=document.querySelector(".eye");


let rect=
eye.getBoundingClientRect();



let centerX=
rect.left + rect.width/2;


let centerY=
rect.top + rect.height/2;



let mouseX=
e.clientX-centerX;


let mouseY=
e.clientY-centerY;



let distance=
Math.sqrt(
mouseX*mouseX+
mouseY*mouseY
);



let maxMove=45;



let moveX=
(mouseX/distance)*maxMove;


let moveY=
(mouseY/distance)*maxMove;



if(distance < maxMove){

moveX=mouseX;

moveY=mouseY;

}




pupil.style.transform=
`
translate(
calc(-50% + ${moveX}px),
calc(-50% + ${moveY}px)
)
`;



});








/* =========================
   SYSTEM VERITY
========================= */


let verityDestroyed=0;




function activateVerity(element){



// empêcher deuxième clic

if(
element.classList.contains("broken")
){

return;

}



element.classList.add("broken");



verityDestroyed++;






/* explosion */


let rect=
element.getBoundingClientRect();



for(let i=0;i<15;i++){


let shard=
document.createElement("div");



shard.className="shard";



shard.innerHTML="VERITY";



shard.style.left=
(rect.left+rect.width/2)+"px";



shard.style.top=
(rect.top+rect.height/2)+"px";




shard.style.setProperty(
"--x",
Math.random()
);



shard.style.setProperty(
"--y",
Math.random()
);



document.body.appendChild(shard);



setTimeout(()=>{

shard.remove();

},1000);



}






/* réaction œil */


let eye=
document.querySelector(".eye");



eye.classList.add("scared");



setTimeout(()=>{


eye.classList.remove("scared");


},800);







// les 4 verity sont trouvés


if(verityDestroyed===4){



setTimeout(()=>{


unlock();



},1500);



}




}








/* =========================
   FIN
========================= */


function unlock(){



let screen=
document.getElementById("screen");



screen.classList.add("show");





setTimeout(()=>{


document
.getElementById("code")
.classList.add("show");



},5000);



}





</script>


</body>

</html>
